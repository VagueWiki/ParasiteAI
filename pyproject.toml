[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parasite-ai"
version = "0.1.0"
description = "100% visible, desktop-native local AI assistant operating on the physical Windows desktop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "ParasiteAI Team" }
]
keywords = [
    "ai-assistant",
    "desktop-automation",
    "computer-vision",
    "kinematics",
    "win32",
    "local-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    # Core schema & configuration
    "pydantic>=2.6.0,<3.0.0",
    "pyyaml>=6.0.1",
    
    # Desktop GUI & Overlay
    "pyqt6>=6.6.0",
    
    # Perception & Screen capture
    "mss>=9.0.1",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    
    # Win32 Grounding & OCR
    "uiautomation>=2.0.19",
    "rapidocr-onnxruntime>=1.3.8",
    
    # Physical input & Kinematics
    "pyautogui>=0.9.54",
    "pytweening>=1.2.0",
    "pynput>=1.7.6",
    
    # Clipboard & Offloader
    "pyperclip>=1.8.2",
    "httpx>=0.27.0",
    "huggingface-hub>=0.23.0",

    # Local GGUF GPU Engine (CUDA 12 prebuilt wheel + runtime DLLs)
    "llama-cpp-python>=0.3.0",
    "nvidia-cuda-runtime-cu12>=12.0",
    "nvidia-cublas-cu12>=12.0",
]

[project.optional-dependencies]
# Optional local GGUF engine alias
local-llm = [
    "llama-cpp-python>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
parasite = "parasite_ai.main:main"

[tool.hatch.build.targets.wheel]
packages = ["parasite_ai"]

[tool.uv]
default-groups = ["dev"]
link-mode = "copy"

[[tool.uv.index]]
name = "llama-cpp-cu124"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

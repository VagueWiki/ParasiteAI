# ==============================================================================
# ParasiteAI - Unified System Configuration
# ==============================================================================

headless: true

system:
  log_level: "INFO"
  integrity_mode: "development"
  data_dir: "data"
  models_dir: "models"
  log_file: "logs/parasite_debug.log"
  save_debug_screenshots: true
  max_screenshot_episodes: 20
  max_archived_logs: 25

persona:
  name: "Parasite"
  avatar: "cyber_cat"
  voice_style: "witty_desktop_companion"
  verbosity: "normal"
  system_prompt: |
    You are Parasite, a desktop-native AI companion living on the user's screen.
    You have direct physical control of the mouse and keyboard when authorized.
    Speak naturally, expressively, and vividly in character.
    Always provide commentary on what you observe on screen before taking action.

brain:
  mode: "local_llm"  # "local_llm", "browser_offload", or "hybrid"
  local_model:
    model_id: "mradermacher/UI-TARS-1.5-7B-GGUF"
    filename: "UI-TARS-1.5-7B.IQ4_XS.gguf"
    mmproj_filename: "UI-TARS-1.5-7B.mmproj-Q8_0.gguf"
    context_size: 8192
    gpu_layers: -1
    vram_budget_mb: 6500
    local_endpoint: "http://127.0.0.1:8080/v1"
    server_binary_path: "bin/llama-server/llama-server.exe"
    server_host: "127.0.0.1"
    server_port: 8080
    auto_start_server: true
    server_startup_timeout_sec: 60.0
    server_parallel_slots: 1
    image_min_tokens: 1024
    kv_cache_type_k: "q8_0"
    kv_cache_type_v: "q8_0"
    cache_reuse_tokens: 0
    keep_server_alive_on_exit: true
    download_auto: false
  offload:
    preferred_browser: "chrome"  # "chrome" or "opera_gx"
    browser_paths:
      chrome: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
      opera_gx: "C:\\Users\\Suici\\AppData\\Local\\Programs\\Opera GX\\opera.exe"
    default_web_ai_url: "https://gemini.google.com"
    stream_stability_ms: 1500
    stream_timeout_sec: 45
    sentinel_token_prefix: "__PARASITE_SENTINEL__"

safety:
  interrupt_enabled: true
  interrupt_latency_budget_ms: 2.0
  override_pause_duration_sec: 2.5
  panic_hotkeys:
    - "ctrl+alt+backspace"
    - "ctrl+alt+p"
    - "esc"
  sensitive_window_titles:
    - "Bitwarden"
    - "1Password"
    - "KeePass"
    - "Task Manager"
    - "Administrator:"
    - "Windows Security"
    - "User Account Control"
    - "Registry Editor"
  sensitive_process_names:
    - "bitwarden.exe"
    - "1password.exe"
    - "keepass.exe"
    - "keepassxc.exe"
    - "taskmgr.exe"
    - "regedit.exe"
    - "credentialui.exe"
    - "consent.exe"
    - "logonui.exe"
  mask_screen_on_sensitive: true

ui:
  dock:
    width: 340
    height: 540
    anchor: "bottom_right"
    margin_x: 24
    margin_y: 24
    opacity: 0.95
    always_on_top: true
    frameless: true
    show_thought_stream: true
    show_perception_preview: true
  hud:
    enabled: true
    fps_target: 60
    reticle_color: "#FF3366"
    reticle_duration_ms: 300
    som_box_color: "#00E5FF"
    som_glow_color: "#00FFCC"
    box_alpha: 0.25
    stroke_width_px: 1.5

discord:
  enabled: false
  token: ""
  authorized_user_ids: []
  authorized_channel_ids: []
  require_risk_consent: true
  consent_timeout_sec: 60.0
  milestone_screenshot_interval: 3
  screen_max_width: 1280
  screen_jpeg_quality: 75

vision:
  grounding_mode: "hybrid"  # "hybrid", "uia_only", or "ocr_only"
  max_som_elements: 100
  screen_diff_threshold: 0.02
  ocr_scoped_only: true
  capture_backend: "mss"
  monitor_index: 1
  settling_diff_threshold: 0.003
  settling_consecutive_polls: 3

hands:
  mouse:
    speed_factor: 1.0
    trajectory_type: "cubic_bezier"
    overshoot_radius_px: 12
    micro_jitter_amplitude_px: 1.5
    step_delay_ms: 8
    preview_reticle_ms: 300
  keyboard:
    typing_wpm: 85
    cadence_jitter_ms: [25, 75]
    micro_pause_probability: 0.04
    micro_pause_duration_ms: [200, 600]
    punctuation_pause_ms: [80, 150]
    multiline_shift_enter: true
  reflex:
    enabled: true
    max_burst_actions: 8
    inter_action_min_ms: 15
    inter_action_max_ms: 30
    reflex_move_duration_ms: 20
    reflex_dwell_ms: 15
    abort_on_window_change: true

window_rules:
  persistent_processes:
    - "antigravity.exe"
    - "code.exe"
    - "cursor.exe"
    - "devenv.exe"
    - "pycharm64.exe"
    - "idea64.exe"
    - "chrome.exe"
    - "msedge.exe"
    - "firefox.exe"
    - "opera.exe"
    - "brave.exe"
    - "discord.exe"
    - "slack.exe"
    - "teams.exe"
    - "steam.exe"
    - "epicgameslauncher.exe"
    - "gog galaxy.exe"
    - "battle.net.exe"
    - "spotify.exe"
    - "obs64.exe"
    - "conhost.exe"
    - "windowsterminal.exe"
    - "powershell.exe"
    - "pwsh.exe"
    - "cmd.exe"
    - "python.exe"
    - "pythonw.exe"
  ephemeral_processes:
    - "notepad.exe"
    - "calc.exe"
    - "calculatorapp.exe"
    - "mspaint.exe"
    - "snippingtool.exe"
    - "wordpad.exe"
  intermediate_launcher_processes:
    - "steam.exe"
    - "steamwebhelper.exe"
    - "epicgameslauncher.exe"
    - "riotclientservices.exe"
    - "riotclientux.exe"
    - "battle.net.exe"
    - "eadestkop.exe"
    - "eaapp.exe"
    - "ubisoftconnect.exe"
    - "goggalaxy.exe"

skills:
  enabled: true
  learning_enabled: false

parasite_skill:
  enabled: true
  proactive_planning: true
  proactive_mode: "open_ended"
  reactive_recovery: true
  local_assist_enabled: true
  max_local_assist_calls_per_invoke: 4
  attach_settle_ms: 2500
  submit_verify_timeout_sec: 1.5
  min_generation_wait_ms: 2000
  scroll_before_copy_attempts: 3
  scroll_wheel_delta: -8

app_memory:
  enabled: true
  db_path: "data/app_memory.db"
